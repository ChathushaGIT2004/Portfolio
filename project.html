<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project | C.J. Dewmith</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#07100b;--panel:#0d1911;--panel2:#111f16;--line:#294732;--green:#70d56b;--lime:#b9ff98;--text:#edf7ef;--muted:#a6b8aa}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 80% 0,#16301d 0,transparent 28%),linear-gradient(#07100b,#0b1510);color:var(--text);font-family:Inter,Arial,sans-serif;line-height:1.7}.mono{font-family:'IBM Plex Mono',monospace}.wrap{width:min(1120px,92%);margin:auto}.topbar{position:sticky;top:0;z-index:20;background:rgba(5,12,8,.94);border-bottom:3px solid #253d2c;box-shadow:0 4px #020805}.topbar .wrap{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:16px}.back{display:inline-flex;align-items:center;gap:10px;color:#e8f7ea;text-decoration:none;font:20px 'Pixelify Sans';padding:10px 14px;border:2px solid #3d6447;background:#112017;box-shadow:4px 4px #000}.back:hover{transform:translate(-2px,-2px);box-shadow:6px 6px #000}.brand{font:28px 'Pixelify Sans';color:#fff}.brand span{color:var(--green)}.hero{padding:70px 0 46px;border-bottom:1px solid #1f3527;position:relative;overflow:hidden}.hero:before{content:'';position:absolute;inset:0;opacity:.12;background-image:linear-gradient(90deg,#fff 1px,transparent 1px),linear-gradient(#fff 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(#000,transparent)}.hero-grid{position:relative;display:grid;grid-template-columns:1fr auto;gap:30px;align-items:center}.kicker{font:13px 'IBM Plex Mono';color:#8ed889;letter-spacing:.09em}.title{font:clamp(54px,9vw,104px) 'Pixelify Sans';line-height:.88;margin:10px 0 18px;text-shadow:6px 6px #000,9px 9px #23482b}.brief{font-size:19px;color:#c3d2c6;max-width:850px}.logo-box{width:170px;height:170px;border:4px solid #42664a;background:#0c1710;box-shadow:8px 8px #000;display:grid;place-items:center;overflow:hidden}.logo-box img{max-width:88%;max-height:88%;object-fit:contain}.logo-fallback{font:64px 'Pixelify Sans';color:var(--lime)}.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}.tag{background:#182b1e;border:2px solid #36553e;padding:5px 9px;font:12px 'IBM Plex Mono';color:#d6ead9}.content{padding:50px 0 90px}.content-block{margin:0 0 38px;padding:24px;background:linear-gradient(145deg,#101c15,#0b1510);border:3px solid #294632;box-shadow:7px 7px #030704;opacity:0;transform:translateY(24px);transition:.55s steps(6)}.content-block.visible{opacity:1;transform:none}.content-block h1,.content-block h2,.content-block h3{font-family:'Pixelify Sans';line-height:1.05;color:#fff;text-shadow:3px 3px #000}.content-block h1{font-size:48px;margin:0 0 16px}.content-block h2{font-size:38px;margin:0 0 14px}.content-block h3{font-size:28px;margin:0 0 12px}.content-block p{color:#c1d0c5;font-size:17px}.content-block ol,.content-block ul{padding-left:24px;color:#c9d8cc}.content-block li{margin:9px 0}.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:20px}.gallery.one{grid-template-columns:1fr}.gallery>div{width:100%;aspect-ratio:16/9;overflow:hidden;background:#08100b;border:3px solid #365840;box-shadow:5px 5px #000}.gallery img{width:100%;height:100%;display:block;object-fit:cover;object-position:center;background:#08100b;transition:transform .35s steps(5)}.gallery>div:hover img{transform:scale(1.025)}.missing-img{width:100%;height:100%;min-height:0;display:grid;place-items:center;text-align:center;padding:20px;background:repeating-linear-gradient(45deg,#0c1610,#0c1610 18px,#111e16 18px,#111e16 36px);border:0;color:#8aa491;font:13px 'IBM Plex Mono'}.quote{border-left:5px solid var(--green);padding:12px 18px;background:#0a140e;color:#cfdfd2;font-style:italic}.code{overflow:auto;background:#050a07;border:2px solid #2a4432;padding:18px;color:#b8f5ad;font:13px 'IBM Plex Mono'}.link-row{display:flex;flex-wrap:wrap;gap:10px}.project-link{color:#fff;text-decoration:none;background:#285533;border:2px solid #62a569;padding:10px 14px;box-shadow:4px 4px #000;font-weight:700}.loader{position:fixed;inset:0;z-index:1000;background:#050b07;display:grid;place-items:center;transition:.35s}.loader.done{opacity:0;visibility:hidden}.loadbox{width:min(520px,84vw);text-align:center}.loadtitle{font:34px 'Pixelify Sans';margin-bottom:16px}.track{height:20px;border:4px solid #49634e;background:#101611;box-shadow:5px 5px #000;padding:2px}.fill{height:100%;width:0;background:repeating-linear-gradient(90deg,#57b653 0 14px,#6edb66 14px 28px);transition:width .15s steps(6)}.pct{font:13px 'IBM Plex Mono';margin-top:10px;color:#a8c5ad}.xp{position:fixed;left:0;right:0;bottom:0;height:5px;background:#071009;z-index:50}.xp span{display:block;height:100%;width:0;background:#78d868}.error{padding:40px;border:3px solid #783f3f;background:#251212;box-shadow:7px 7px #000}.error h1{font:44px 'Pixelify Sans';margin-top:0}@media(max-width:760px){.hero-grid{grid-template-columns:1fr}.logo-box{width:120px;height:120px;order:-1}.gallery{grid-template-columns:1fr}.content-block{padding:18px}.content-block h1{font-size:38px}.title{font-size:58px}.brand{display:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.content-block{opacity:1;transform:none}}
</style></head><body>
<div class="loader" id="loader"><div class="loadbox"><div class="loadtitle">LOADING PROJECT WORLD...</div><div class="track"><div class="fill" id="fill"></div></div><div class="pct" id="pct">READING PROJECT JSON • 0%</div></div></div>
<div class="xp"><span id="xp"></span></div><header class="topbar"><div class="wrap"><a class="back" href="index.html#projects">← BACK TO PROJECTS</a><div class="brand">C.J.<span>DEW</span> / PROJECT WORLD</div></div></header>
<main><section class="hero"><div class="wrap hero-grid"><div><div class="kicker" id="kicker">PROJECT</div><h1 class="title" id="title">Loading...</h1><p class="brief" id="brief"></p><div class="tags" id="tags"></div></div><div class="logo-box" id="logoBox"><div class="logo-fallback">?</div></div></div></section><section class="content"><div class="wrap" id="content"></div></section></main>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const list=v=>Array.isArray(v)?v:[v];
function imageGallery(value){const imgs=list(value).filter(Boolean);if(!imgs.length)return'';return `<div class="gallery ${imgs.length===1?'one':''}">${imgs.map(src=>`<div><img src="${esc(src)}" alt="Project image" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"><div class="missing-img" style="display:none">IMAGE PLACEHOLDER<br>${esc(src)}</div></div>`).join('')}</div>`}
function renderEntry(key,value){const k=key.toLowerCase().replace(/[ _-]/g,'');
 if(/^head1$|^h1$|^title$/.test(k))return `<h1>${esc(value)}</h1>`;
 if(/^head2$|^h2$|^subtitle$/.test(k))return `<h2>${esc(value)}</h2>`;
 if(/^head3$|^h3$/.test(k))return `<h3>${esc(value)}</h3>`;
 if(['p','paragraph','description','desc','text'].includes(k))return `<p>${esc(value)}</p>`;
 if(['img','image','images','gallery'].includes(k))return imageGallery(value);
 if(['ol','orderedlist'].includes(k))return `<ol>${list(value).map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`;
 if(['ul','list','unorderedlist'].includes(k))return `<ul>${list(value).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
 if(k==='quote')return `<div class="quote">${esc(value)}</div>`;
 if(k==='code')return `<pre class="code"><code>${esc(value)}</code></pre>`;
 if(k==='links')return `<div class="link-row">${list(value).map(x=>typeof x==='string'?`<a class="project-link" href="${esc(x)}" target="_blank" rel="noopener">OPEN LINK</a>`:`<a class="project-link" href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.label||'OPEN LINK')}</a>`).join('')}</div>`;
 if(k==='spacer')return `<div style="height:${Number(value)||24}px"></div>`;
 return `<div><h3>${esc(key)}</h3>${typeof value==='string'?`<p>${esc(value)}</p>`:`<pre class="code">${esc(JSON.stringify(value,null,2))}</pre>`}</div>`;
}
function renderContent(blocks){const root=document.getElementById('content');root.innerHTML=list(blocks||[]).map(block=>`<article class="content-block">${Object.entries(block).map(([k,v])=>renderEntry(k,v)).join('')}</article>`).join('');const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('visible')}),{threshold:.08});root.querySelectorAll('.content-block').forEach(x=>io.observe(x));}
async function boot(){const params=new URLSearchParams(location.search),id=params.get('id');let n=15;const fill=document.getElementById('fill'),pct=document.getElementById('pct');const t=setInterval(()=>{n=Math.min(n+Math.ceil(Math.random()*10),88);fill.style.width=n+'%';pct.textContent='READING PROJECT JSON • '+n+'%'},90);try{const lr=await fetch('projects/project-list.json');if(!lr.ok)throw Error('Could not load project-list.json');const listData=await lr.json();const meta=(listData.projects||[]).find(p=>p.id===id);if(!meta)throw Error('Project was not found in project-list.json');const dr=await fetch(meta.detailFile);if(!dr.ok)throw Error('Could not load '+meta.detailFile);const p=await dr.json();document.title=p.name+' | C.J. Dewmith';document.getElementById('kicker').textContent=p.kicker||meta.kicker||'PROJECT';document.getElementById('title').textContent=p.name||meta.name;document.getElementById('brief').textContent=p.brief||meta.brief||'';document.getElementById('tags').innerHTML=(p.tags||meta.tags||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join('');const lb=document.getElementById('logoBox');if(p.logo){lb.innerHTML=`<img src="${esc(p.logo)}" alt="${esc(p.name)} logo" onerror="this.parentElement.innerHTML='<div class=\'logo-fallback\'>${esc((p.name||'?')[0])}</div>'">`}else lb.innerHTML=`<div class="logo-fallback">${esc((p.name||'?')[0])}</div>`;renderContent(p.content);clearInterval(t);fill.style.width='100%';pct.textContent='PROJECT WORLD READY • 100%';setTimeout(()=>document.getElementById('loader').classList.add('done'),300)}catch(err){clearInterval(t);document.getElementById('loader').classList.add('done');document.getElementById('content').innerHTML=`<div class="error"><h1>PROJECT DATA COULD NOT LOAD</h1><p>${esc(err.message)}</p><p class="mono">If you opened this website directly as a file, JSON fetch may be blocked by the browser. Open the folder using VS Code Live Server or another local web server.</p></div>`;}}
boot();addEventListener('scroll',()=>{const h=document.documentElement.scrollHeight-innerHeight;document.getElementById('xp').style.width=(h?scrollY/h*100:0)+'%'});
</script></body></html>
